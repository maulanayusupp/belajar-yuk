<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F5BFF"/>
      <stop offset="0.55" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00CEC9"/>
    </linearGradient>
    <linearGradient id="balloon" x1="820" y1="120" x2="1040" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE0EC"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 210) rotate(45) scale(90)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1A1035" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Latar -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="200" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="90" cy="600" r="230" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="640" cy="120" r="120" fill="#FFFFFF" opacity="0.05"/>

  <!-- ============ Kolom kiri: teks ============ -->
  <!-- Pill -->
  <rect x="80" y="96" width="360" height="52" rx="26" fill="#FFFFFF" opacity="0.18"/>
  <text x="108" y="131" font-family="Nunito, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">PLATFORM BELAJAR ANAK</text>

  <!-- Judul -->
  <text x="76" y="270" font-family="'Baloo 2', Nunito, Arial, sans-serif" font-size="118" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Belajar Yuk!</text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="Nunito, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" opacity="0.96">Bahasa Inggris &amp; Matematika</text>
  <text x="80" y="392" font-family="Nunito, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" opacity="0.96">jadi Petualangan Seru</text>

  <!-- Chips mata pelajaran -->
  <g>
    <rect x="80" y="440" width="230" height="70" rx="20" fill="#FFFFFF"/>
    <text x="118" y="485" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="800" fill="#EE7752">ABC · English</text>
  </g>
  <g>
    <rect x="330" y="440" width="270" height="70" rx="20" fill="#FFFFFF"/>
    <text x="366" y="485" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="800" fill="#3867D6">1+2 · Matematika</text>
  </g>

  <!-- Trust -->
  <text x="82" y="560" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" opacity="0.9">Gratis · Tanpa Iklan · Usia 6+ · Penuh Animasi &amp; Suara</text>

  <!-- ============ Kolom kanan: balon ============ -->
  <g filter="url(#soft)">
    <!-- Tali -->
    <path d="M930 430 C 916 476, 952 500, 930 548" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Badan balon -->
    <path d="M930 120 C 1016 120, 1060 190, 1060 272 C 1060 366, 994 424, 930 436 C 866 424, 800 366, 800 272 C 800 190, 844 120, 930 120 Z" fill="url(#balloon)"/>
    <!-- Simpul -->
    <path d="M912 432 L 948 432 L 930 462 Z" fill="#FFD3E2"/>
    <!-- Kilau -->
    <ellipse cx="880" cy="210" rx="42" ry="58" fill="url(#shine)" opacity="0.9" transform="rotate(-20 880 210)"/>
  </g>

  <!-- Kartu mengambang mini -->
  <g filter="url(#soft)">
    <rect x="1030" y="330" width="120" height="120" rx="28" fill="#FFFFFF"/>
    <text x="1090" y="415" text-anchor="middle" font-family="'Baloo 2', Nunito, Arial, sans-serif" font-size="72" font-weight="800" fill="#4B7BEC">5</text>
  </g>
  <g filter="url(#soft)">
    <rect x="720" y="150" width="120" height="120" rx="28" fill="#FFFFFF"/>
    <text x="780" y="238" text-anchor="middle" font-family="'Baloo 2', Nunito, Arial, sans-serif" font-size="72" font-weight="800" fill="#EE7752">A</text>
  </g>

  <!-- Bintang vektor -->
  <path d="M1120 470 l 14 34 l 34 14 l -34 14 l -14 34 l -14 -34 l -34 -14 l 34 -14 Z" fill="#FECA57"/>
  <path d="M700 400 l 10 24 l 24 10 l -24 10 l -10 24 l -10 -24 l -24 -10 l 24 -10 Z" fill="#FECA57"/>
</svg>
